# Portiert aus foot/foot.ini (Melange Theme, siehe colors/melange.conf)

# Font (foot: font=JetBrainsMono:size=13)
font_family JetBrainsMono
font_size 13.0

# Nerd Font Symbols (separat installiert) nur fuer die Icon-Codepoints nutzen
# Ranges = tatsaechliche cmap-Abdeckung von Symbols Nerd Font Mono
symbol_map U+23FB-U+23FE,U+2630-U+2630,U+2665-U+2665,U+26A1-U+26A1,U+276C-U+2771,U+2B58-U+2B58,U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6BB,U+E700-U+E958,U+EA60-U+EC84,U+ED00-U+EFCF,U+F000-U+F385,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Scrollback (foot: [scrollback] lines=500)
scrollback_lines 500

# Farben (foot: [colors])
foreground #ECE1D7
background #292522

# Regular colors (0-7)
color0  #242424  # black
color1  #BD8183  # red
color2  #78997A  # green
color3  #E49B5D  # yellow
color4  #7F91B2  # blue
color5  #B380B0  # magenta
color6  #7B9695  # cyan
color7  #ECE1D7  # white

# Bright colors (8-15)
color8   #616161  # bright black
color9   #D47766  # bright red
color10  #85B695  # bright green
color11  #EBC06D  # bright yellow
color12  #A3A9CE  # bright blue
color13  #CF9BC2  # bright magenta
color14  #89B3B6  # bright cyan
color15  #ffffff  # bright white

# Selection (foot nutzt standardmäßig invers; melange sel = #403A36)
# selection_foreground #ECE1D7
# selection_background #403A36

# Cursor (foot nutzt standardmäßig fg als Cursorfarbe)
# cursor #ECE1D7
